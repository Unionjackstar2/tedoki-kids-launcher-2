name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.5.${{ github.run_number }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      # Funktioniert mit Projektdateien im Repo ODER nur einer ZIP-Datei im Repo
      - name: Projekt finden (oder ZIP entpacken)
        run: |
          find_settings() {
            find "$1" -maxdepth 4 -name "settings.gradle.kts" \
              -not -path "*/node_modules/*" -not -path "*/build/*" | head -n 1
          }

          SETTINGS=$(find_settings .)

          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::Weder settings.gradle.kts noch eine ZIP-Datei im Repo gefunden."
              find . -maxdepth 2 -not -path "./.git/*" | sort
              exit 1
            fi
            echo "Entpacke $ZIP ..."
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
            SETTINGS=$(find_settings "$RUNNER_TEMP/src")
            if [ -z "$SETTINGS" ]; then
              echo "::error::In $ZIP liegt keine settings.gradle.kts."
              find "$RUNNER_TEMP/src" -maxdepth 3 | sort
              exit 1
            fi
          fi

          PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)
          echo "Projektordner: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Release-Keystore wiederherstellen
        env:
          KS_B64: ${{ secrets.EVR_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE }}
          KS_PW: ${{ secrets.EVR_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Kein Keystore-Secret gefunden – APK wird mit Debug-Schlüssel signiert."
            exit 0
          fi
          if [ -z "$KS_PW" ]; then
            echo "::error::Keystore gefunden, aber kein Passwort-Secret."
            exit 1
          fi
          echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore wiederhergestellt ($(stat -c %s "$RUNNER_TEMP/release.jks") Bytes)."

      - name: APK bauen
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EVR_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/release/*.apk "out/TEDOKI-kids-${VERSION_NAME}.apk"
          ls -la out

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: TEDOKI-kids-${{ env.VERSION_NAME }}
          path: out/*.apk
          retention-days: 30
