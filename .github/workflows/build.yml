name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neueste ELdoroado-ZIP finden und entpacken
        run: |
          ZIP=""
          NEWEST=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            t=${t:-0}
            if [ "$t" -ge "$NEWEST" ]; then NEWEST=$t; ZIP="$f"; fi
          done < <(find . -path ./.git -prune -o -iname 'tedoki-kids*.zip' -print)
          if [ -z "$ZIP" ]; then
            echo "::error::Keine tedoki-kids*.zip im Repository gefunden"
            exit 1
          fi
          echo "Verwende $ZIP"
          # ZIP mit „beta“ im Namen → Beta-App mit eigener Paketkennung und eigenem Release
          case "$(basename "$ZIP" | tr '[:upper:]' '[:lower:]')" in
            *beta*) echo "BETA=true" >> "$GITHUB_ENV"; echo "Baue Beta-Fassung" ;;
            *) echo "BETA=false" >> "$GITHUB_ENV" ;;
          esac
          unzip -o -q "$ZIP" -d _src
          cp -r _src/tedoki-kids-launcher-2-main/. .
          rm -rf _src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Release-Schlüssel einrichten (falls als Secret hinterlegt)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EVR_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "EVR_KEYSTORE_PASSWORD=$KP" >> "$GITHUB_ENV"
            echo "Signiere mit Release-Schlüssel"
          else
            echo "Kein Release-Schlüssel hinterlegt, Debug-Schlüssel wird verwendet"
          fi

      - name: NDK und CMake für den KI-Assistenten installieren
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null
          echo "NDK und CMake bereit"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: APK bauen
        run: gradle testDebugUnitTest assembleDebug -Pbeta=$BETA --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk TedokiKidsLauncher.apk

      - name: Signatur der APK anzeigen
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs TedokiKidsLauncher.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: TedokiKidsLauncher-apk
          path: TedokiKidsLauncher.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BETA" = "true" ]; then
            cp TedokiKidsLauncher.apk TedokiKidsLauncher-Beta.apk
            gh release delete beta --yes --cleanup-tag || true
            gh release create beta TedokiKidsLauncher-Beta.apk --target "${{ github.sha }}" --prerelease \
              --title "TedokiKidsLauncher Beta – neuester Test-Build" --notes "Beta, läuft neben der normalen App. Gebaut aus ${{ github.sha }}"
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest TedokiKidsLauncher.apk --target "${{ github.sha }}" \
              --title "TedokiKidsLauncher – neuester Build" --notes "Automatisch gebaut aus ${{ github.sha }}"
          fi
